plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

keyed_groups:
  - key: tags.Name
    prefix: dynamic
    separator: "-"  # create like this dynamic_frontend

filters:
  instance-state-name: running

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address





# Instead of manually writing server IPs in inventory.ini, 
# Ansible automatically gets EC2 instances from AWS.

#Use the AWS EC2 inventory plugin.
#Search for EC2 instances in the us-east-1 region.
# Only fetch EC2 instances whose Name tag is frontend.
# Only include instances that are in the running state.

# ansible using aws_ec2 plugin only fetched running instance as in defined tag name frontend 
# create one dynamic group like dynamic-frontend and connects only rinnung instances using 
# ip address 
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

keyed_groups:
  - key: tags.Name
    prefix: dynamic
    separator: "-"

filters:
  instance-state-name: running

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address


- name: nginx install and run   
  hosts: frontend  #[frontend] mention inventort.ini 
  become: yes # sudo access     
  tasks:  
    - name: install nginx server #first task install nginx                  
      ansible.builtin.package:     
        name: nginx
        state: present

    - name: start nginx
      ansible.builtin.service:
        name: nginx
        state: started 
        enabled: yes 



